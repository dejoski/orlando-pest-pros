# Cloudflare Pages deployment for Orlando Pest Pros (migrated off Vercel 2026-10).
# Build output (Astro + @astrojs/cloudflare) is deployed with:
#   npm run build && npx wrangler pages deploy dist --project-name=orlando-pest-pros
name = "orlando-pest-pros"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-15"
# nodejs_compat makes runtime env vars (Pages project settings / secrets)
# readable via process.env in the Worker — the dashboard reads
# DASHBOARD_TOKEN that way. Lead/analytics storage uses the OPP_KV
# KV namespace binding below (locals.runtime.env.OPP_KV).
compatibility_flags = ["nodejs_compat"]

# Lead + analytics storage (src/lib/leads.ts, src/pages/api/track.js,
# dashboard). The id is a PLACEHOLDER until the real namespace is
# created and filled in at deploy time.
[[kv_namespaces]]
binding = "OPP_KV"
id = "3f4c78967ffe47fb9352ef413d3a0f17"
